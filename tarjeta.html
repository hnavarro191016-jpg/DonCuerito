<!DOCTYPE html>
<html lang="es-MX">
<head>
  <meta charset="UTF-8">
  <title>Tarjeta de Presentación - Hugo Navarro</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&family=Playfair+Display:ital,wght@0,600;0,700;1,600&display=swap" rel="stylesheet">
  <style>
    :root {
      --red: #8c2a20;
      --ink: #21392A;
      --paper: #F9F6F0;
    }
    
    body {
      margin: 0;
      padding: 40px;
      background-color: #e0e0e0;
      font-family: 'Montserrat', sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 40px;
    }

    /* Standard Business Card Size: 3.5in x 2in (Scaled up for web viewing, ratio 1.75) */
    .card {
      width: 600px;
      height: 342px;
      background: white;
      box-shadow: 0 15px 30px rgba(0,0,0,0.15);
      position: relative;
      overflow: hidden;
      display: flex;
    }

    /* FRONT DESIGN */
    .card-front {
      background-color: var(--paper);
      justify-content: center;
      align-items: center;
      flex-direction: column;
    }

    .card-front img {
      width: 250px;
      mix-blend-mode: multiply;
    }

    .card-front .tagline {
      margin-top: 15px;
      font-family: 'Playfair Display', serif;
      font-size: 1.2rem;
      color: var(--ink);
      font-style: italic;
    }

    /* BACK DESIGN */
    .card-back {
      background-color: var(--ink);
      color: white;
    }

    .back-left {
      width: 40%;
      background-color: var(--red);
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    .back-left .qr-container {
      background: white;
      padding: 10px;
      border-radius: 8px;
    }

    .back-left img {
      width: 140px;
      height: 140px;
      display: block;
    }

    .back-right {
      width: 60%;
      padding: 40px;
      display: flex;
      flex-direction: column;
      justify-content: center;
    }

    .name {
      font-family: 'Playfair Display', serif;
      font-size: 2.2rem;
      margin: 0 0 5px 0;
      color: var(--paper);
    }

    .title {
      font-size: 1rem;
      text-transform: uppercase;
      letter-spacing: 0.15em;
      color: #A3B1A7;
      margin: 0 0 30px 0;
    }

    .contact-info {
      display: flex;
      flex-direction: column;
      gap: 15px;
    }

    .contact-item {
      display: flex;
      align-items: center;
      gap: 15px;
      font-size: 1.1rem;
    }

    .contact-icon {
      width: 24px;
      height: 24px;
      fill: var(--paper);
    }

    @media print {
      body { background: white; padding: 0; display: block; }
      .card { box-shadow: none; page-break-after: always; margin: 0; }
    }
  </style>
</head>
<body>

  <!-- FRONT OF CARD -->
  <div class="card card-front">
    <img src="assets/logo-don-cuerito.jpg" alt="Tradicional Don Cuerito">
    <div class="tagline">El antojo tiene su buen corte.</div>
  </div>

  <!-- BACK OF CARD -->
  <div class="card card-back">
    <div class="back-left">
      <div class="qr-container">
        <img src="assets/qr-whatsapp.png" alt="Código QR WhatsApp">
      </div>
    </div>
    <div class="back-right">
      <h1 class="name">Hugo Navarro</h1>
      <h2 class="title">Asesor de Ventas</h2>
      
      <div class="contact-info">
        <div class="contact-item">
          <svg class="contact-icon" viewBox="0 0 24 24">
            <path d="M6.62 10.79c1.44 2.83 3.76 5.14 6.59 6.59l2.2-2.2c.27-.27.67-.36 1.02-.24 1.12.37 2.33.57 3.57.57.55 0 1 .45 1 1V20c0 .55-.45 1-1 1-9.39 0-17-7.61-17-17 0-.55.45-1 1-1h3.5c.55 0 1 .45 1 1 0 1.25.2 2.45.57 3.57.11.35.03.74-.25 1.02l-2.2 2.2z"/>
          </svg>
          81 4247 7041
        </div>
      </div>
    </div>
  </div>

</body>
</html>
